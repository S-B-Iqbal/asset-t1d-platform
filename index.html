<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body style="margin:0">
<title>DiaTrapper Prototype</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#F4F3EF; --surface:#FFFFFF; --surface-2:#FAF9F6; --surface-3:#F0EEE8;
  --border:#E5E2DA; --border-2:#D2CEC4;
  --ink:#1C1B18; --ink-2:#4B4842; --ink-3:#7C7870; --ink-4:#A8A49C;
  --accent:#1E6A86; --accent-hover:#175A73; --accent-tint:#E4F0F4; --accent-tint-2:#C8E0E9; --accent-ink:#0F4457; --on-accent:#FFFFFF;
  --side:#13232B; --side-text:#B7C5CC; --side-muted:#7C919A; --side-active:#1F3B48; --side-border:#22363F; --side-mark:#5FB3D3; --side-chip:rgba(255,255,255,.05);
  --ok:#2E7D4F; --ok-tint:#E2F2E8; --warn:#A8690F; --warn-tint:#FBEFD6; --danger:#BE3A2C; --danger-tint:#FBE3DF; --violet:#5B4FA8; --violet-tint:#ECE9F8;
  --focus:rgba(30,106,134,.28);
  --shadow:0 1px 2px rgba(19,35,43,.05); --shadow-lg:0 12px 32px rgba(19,35,43,.14),0 2px 6px rgba(19,35,43,.08);
  --font:'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif;
  --font-ar:'IBM Plex Sans Arabic','IBM Plex Sans','Segoe UI',Tahoma,Arial,sans-serif;
  --mono:'IBM Plex Mono',SFMono-Regular,Menlo,Consolas,monospace;
  --r-ctl:8px; --r-card:12px; --r-dlg:16px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#14191C; --surface:#1C2226; --surface-2:#20272B; --surface-3:#273035;
    --border:#2C363C; --border-2:#3A464D;
    --ink:#ECEAE3; --ink-2:#C2BFB6; --ink-3:#8F8C84; --ink-4:#6B6A64;
    --accent:#5FB3D3; --accent-hover:#7CC3DD; --accent-tint:#1B3440; --accent-tint-2:#24485A; --accent-ink:#BFE3F0; --on-accent:#0B1E26;
    --side:#0E1A20; --side-active:#1B3340; --side-border:#1B2A32; --side-chip:rgba(255,255,255,.05);
    --ok:#5CBF86; --ok-tint:#173225; --warn:#D9A24A; --warn-tint:#3A2C12; --danger:#E5705F; --danger-tint:#3E1F1B; --violet:#A79BE0; --violet-tint:#2A2544;
    --focus:rgba(95,179,211,.35);
    --shadow:0 1px 2px rgba(0,0,0,.3); --shadow-lg:0 12px 32px rgba(0,0,0,.5),0 2px 6px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  --bg:#14191C; --surface:#1C2226; --surface-2:#20272B; --surface-3:#273035;
  --border:#2C363C; --border-2:#3A464D;
  --ink:#ECEAE3; --ink-2:#C2BFB6; --ink-3:#8F8C84; --ink-4:#6B6A64;
  --accent:#5FB3D3; --accent-hover:#7CC3DD; --accent-tint:#1B3440; --accent-tint-2:#24485A; --accent-ink:#BFE3F0; --on-accent:#0B1E26;
  --side:#0E1A20; --side-active:#1B3340; --side-border:#1B2A32; --side-chip:rgba(255,255,255,.05);
  --ok:#5CBF86; --ok-tint:#173225; --warn:#D9A24A; --warn-tint:#3A2C12; --danger:#E5705F; --danger-tint:#3E1F1B; --violet:#A79BE0; --violet-tint:#2A2544;
  --focus:rgba(95,179,211,.35);
  --shadow:0 1px 2px rgba(0,0,0,.3); --shadow-lg:0 12px 32px rgba(0,0,0,.5),0 2px 6px rgba(0,0,0,.3);
}
:root[lang="ar"]{ --font:var(--font-ar); }

html,body{height:100%;}
*,*::before,*::after{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;}
a{color:var(--accent);text-decoration:none;} a:hover{color:var(--accent-hover);text-decoration:underline;}
button,input,select,textarea{font:inherit;color:inherit;}
button{background:none;border:0;padding:0;cursor:pointer;}
h1,h2,h3,h4,p{margin:0;}
h1,h2,h3{text-wrap:balance;}
svg.ic{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;}
.ic-16{width:16px;height:16px;} .ic-18{width:18px;height:18px;} .ic-22{width:22px;height:22px;} .ic-24{width:24px;height:24px;}
[dir="rtl"] .flip{transform:scaleX(-1);}
.mono{font-family:var(--mono);font-size:13px;font-weight:500;letter-spacing:0;white-space:nowrap;unicode-bidi:isolate;}
.ltr{direction:ltr;unicode-bidi:isolate;display:inline-block;}
.muted{color:var(--ink-3);} .muted-2{color:var(--ink-2);} .small{font-size:12px;} .xs{font-size:11px;} .strong{font-weight:600;}
.nowrap{white-space:nowrap;} .tnum{font-variant-numeric:tabular-nums;}
.eyebrow{font-size:11px;font-weight:600;color:var(--ink-3);text-transform:uppercase;letter-spacing:.07em;}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
[hidden]{display:none!important;}
@media (prefers-reduced-motion: reduce){ *{transition:none!important;animation:none!important;} }

/* ---------- layout helpers ---------- */
.row{display:flex;align-items:center;gap:12px;} .row-s{display:flex;align-items:flex-start;gap:12px;} .row-b{display:flex;align-items:center;justify-content:space-between;gap:12px;}
.col{display:flex;flex-direction:column;gap:12px;} .gap-4{gap:4px;} .gap-6{gap:6px;} .gap-8{gap:8px;} .gap-16{gap:16px;} .gap-20{gap:20px;} .gap-24{gap:24px;}
.wrap{flex-wrap:wrap;} .grow{flex:1;min-width:0;} .end{margin-inline-start:auto;}
.grid{display:grid;gap:16px;} .g2{grid-template-columns:repeat(2,minmax(0,1fr));} .g3{grid-template-columns:repeat(3,minmax(0,1fr));} .g4{grid-template-columns:repeat(4,minmax(0,1fr));}
.g-main{grid-template-columns:minmax(0,1fr) 360px;gap:20px;align-items:start;} .g-main-l{grid-template-columns:300px minmax(0,1fr);gap:20px;align-items:start;}
.g-3col{grid-template-columns:300px minmax(0,1fr) 320px;gap:20px;align-items:start;}
@media (max-width:1100px){ .g-main,.g-main-l,.g-3col{grid-template-columns:minmax(0,1fr);} .g4{grid-template-columns:repeat(2,minmax(0,1fr));} }
@media (max-width:640px){ .g2,.g3,.g4{grid-template-columns:minmax(0,1fr);} }

/* ---------- controls ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 16px;border-radius:var(--r-ctl);font-size:14px;font-weight:600;white-space:nowrap;border:1px solid transparent;transition:background .15s,border-color .15s,color .15s;}
.btn-primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent);} .btn-primary:hover{background:var(--accent-hover);border-color:var(--accent-hover);}
.btn-secondary{background:var(--surface);color:var(--ink);border-color:var(--border-2);} .btn-secondary:hover{background:var(--surface-2);}
.btn-ghost{background:transparent;color:var(--ink-2);} .btn-ghost:hover{background:var(--surface-3);color:var(--ink);}
.btn-tint{background:var(--accent-tint);color:var(--accent-ink);border-color:var(--accent-tint-2);} .btn-tint:hover{background:var(--accent-tint-2);}
.btn-danger{background:var(--danger);color:#fff;border-color:var(--danger);}
.btn-outline-danger{background:var(--surface);color:var(--danger);border-color:var(--border-2);} .btn-outline-danger:hover{background:var(--danger-tint);}
.btn-dark{background:var(--side-active);color:#fff;border-color:var(--side-active);}
.btn-sm{height:32px;padding:0 12px;font-size:13px;} .btn-md{height:40px;} .btn-lg{height:52px;padding:0 22px;font-size:16px;} .btn-xl{height:56px;padding:0 24px;font-size:17px;}
.btn-block{width:100%;} .btn[disabled]{opacity:.5;cursor:not-allowed;}
.icon-btn{position:relative;display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:var(--r-ctl);border:1px solid var(--border);background:var(--surface);color:var(--ink-2);}
.icon-btn:hover{background:var(--surface-2);} .icon-btn.sm{width:36px;height:36px;} .icon-btn.md{width:40px;height:40px;} .icon-btn.plain{border-color:transparent;background:transparent;}
.icon-btn .dot{position:absolute;top:8px;inset-inline-end:8px;width:8px;height:8px;border-radius:999px;background:var(--danger);border:2px solid var(--surface);}
.input,.select,.textarea{width:100%;height:44px;padding:0 12px;border-radius:var(--r-ctl);border:1px solid var(--border-2);background:var(--surface);color:var(--ink);font-size:14px;transition:border-color .15s,box-shadow .15s;}
.input::placeholder,.textarea::placeholder{color:var(--ink-4);}
.input:focus,.select:focus,.textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--focus);}
.input.sm{height:40px;} .input.mono{font-family:var(--mono);}
.textarea{height:auto;min-height:96px;padding:10px 12px;resize:vertical;line-height:1.5;}
.select{appearance:none;padding-inline-end:36px;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%237C7870' stroke-width='1.75' stroke-linecap='round' stroke-linejoin='round'><path d='M6 9l6 6 6-6'/></svg>");background-repeat:no-repeat;background-position:right 12px center;background-size:16px;}
[dir="rtl"] .select{background-position:left 12px center;}
.field{display:flex;flex-direction:column;gap:6px;} .label{font-size:13px;font-weight:600;color:var(--ink-2);} .label .req{color:var(--danger);margin-inline-start:3px;} .help{font-size:12px;color:var(--ink-3);}
.input-wrap{position:relative;display:flex;align-items:center;} .input-wrap .input{padding-inline-end:64px;} .input-wrap .unit{position:absolute;inset-inline-end:12px;font-size:13px;color:var(--ink-3);pointer-events:none;}
.input-wrap.icon .input{padding-inline-start:40px;} .input-wrap .lead{position:absolute;inset-inline-start:12px;color:var(--ink-3);display:flex;pointer-events:none;}
.input.invalid{border-color:var(--danger);}
.check{display:flex;align-items:center;gap:10px;min-height:44px;cursor:pointer;font-size:14px;} .check input{position:absolute;opacity:0;width:0;height:0;}
.check .box{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:6px;border:1.5px solid var(--border-2);background:var(--surface);flex:none;color:var(--on-accent);transition:background .12s;}
.check input:checked + .box{background:var(--accent);border-color:var(--accent);} .check .box svg{opacity:0;} .check input:checked + .box svg{opacity:1;}
.check input:focus-visible + .box{box-shadow:0 0 0 3px var(--focus);}
.switch{display:inline-flex;align-items:center;gap:10px;cursor:pointer;min-height:44px;} .switch input{position:absolute;opacity:0;width:0;height:0;}
.switch .track{position:relative;width:40px;height:24px;border-radius:999px;background:var(--border-2);transition:background .15s;flex:none;} .switch .track::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:18px;height:18px;border-radius:999px;background:#fff;transition:transform .15s;}
.switch input:checked + .track{background:var(--accent);} .switch input:checked + .track::after{transform:translateX(16px);} [dir="rtl"] .switch input:checked + .track::after{transform:translateX(-16px);}
.chip{display:inline-flex;align-items:center;gap:6px;height:44px;padding:0 14px;border-radius:999px;border:1.5px solid var(--border-2);background:var(--surface);font-size:14px;font-weight:600;color:var(--ink);cursor:pointer;}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent);}
.seg{display:flex;gap:2px;padding:3px;border-radius:10px;background:var(--surface-3);} .seg button{flex:1;height:38px;border-radius:7px;font-size:14px;font-weight:600;color:var(--ink-3);} .seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(19,35,43,.12);}

/* ---------- badges ---------- */
.badge{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap;line-height:1;background:var(--surface-3);color:var(--ink-2);}
.badge .d{width:6px;height:6px;border-radius:999px;background:currentColor;}
.b-ok{background:var(--ok-tint);color:var(--ok);} .b-warn{background:var(--warn-tint);color:var(--warn);} .b-danger{background:var(--danger-tint);color:var(--danger);}
.b-accent{background:var(--accent-tint);color:var(--accent-ink);} .b-violet{background:var(--violet-tint);color:var(--violet);} .b-outline{background:transparent;border:1px solid var(--border-2);}
.badge.lg{height:28px;padding:0 12px;font-size:13px;}

/* ---------- cards / tables / kpi ---------- */
.card{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-card);box-shadow:var(--shadow);overflow:hidden;}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px;border-bottom:1px solid var(--border);}
.card-h h3{font-size:15px;font-weight:600;} .card-h .sub{font-size:13px;color:var(--ink-3);font-weight:400;margin-top:2px;}
.card-b{padding:18px 20px;} .card-b.tight{padding:0;} .card-f{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 20px;border-top:1px solid var(--border);}
.list-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 20px;border-bottom:1px solid var(--border);min-height:56px;} .list-row:last-child{border-bottom:0;}
.kpi{display:flex;flex-direction:column;gap:10px;padding:18px 20px;border-radius:var(--r-card);border:1px solid var(--border);background:var(--surface);min-height:112px;}
.kpi .k-l{display:flex;align-items:center;justify-content:space-between;font-size:13px;font-weight:600;color:var(--ink-2);} .kpi .k-v{display:flex;align-items:baseline;gap:10px;} .kpi .k-n{font-size:30px;font-weight:600;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums;} .kpi .k-s{font-size:13px;color:var(--ink-3);}
.kpi.warn{background:var(--warn-tint);} .kpi.warn .k-l,.kpi.warn .k-n,.kpi.warn .k-s{color:var(--warn);} .kpi.danger{background:var(--danger-tint);} .kpi.danger .k-l,.kpi.danger .k-n,.kpi.danger .k-s{color:var(--danger);}
.tbl-wrap{overflow-x:auto;} table.tbl{width:100%;border-collapse:collapse;}
.tbl th{text-align:start;padding:0 14px;height:42px;font-size:12px;font-weight:600;color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em;border-bottom:1px solid var(--border);background:var(--surface-2);white-space:nowrap;}
.tbl td{padding:10px 14px;height:54px;font-size:14px;border-bottom:1px solid var(--border);vertical-align:middle;} .tbl tr:last-child td{border-bottom:0;}
.tbl tr.click{cursor:pointer;} .tbl tr.click:hover td{background:var(--surface-2);} .tbl .r{text-align:end;} .tbl .c{text-align:center;}
.masked{color:var(--ink-2);letter-spacing:.04em;white-space:nowrap;direction:ltr;unicode-bidi:isolate;display:inline-block;}
.avatar{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:999px;background:var(--accent);color:#fff;font-size:12px;font-weight:600;flex:none;letter-spacing:.02em;}
.avatar.lg{width:56px;height:56px;font-size:18px;} .avatar.av-dark{background:#2C5566;} .avatar.mask{background:var(--surface-3);color:var(--ink-3);}
.note{display:flex;align-items:flex-start;gap:10px;padding:12px 14px;border-radius:10px;font-size:13px;line-height:1.45;background:var(--surface-3);color:var(--ink-2);} .note svg{flex:none;margin-top:1px;}
.note.accent{background:var(--accent-tint);color:var(--accent-ink);} .note.warn{background:var(--warn-tint);color:var(--warn);} .note.danger{background:var(--danger-tint);color:var(--danger);} .note.ok{background:var(--ok-tint);color:var(--ok);}
.tabs{display:flex;gap:24px;border-bottom:1px solid var(--border);overflow-x:auto;} .tabs button{display:flex;align-items:center;gap:6px;height:44px;padding:0 2px;font-size:14px;font-weight:500;color:var(--ink-3);border-bottom:2px solid transparent;white-space:nowrap;} .tabs button.on{color:var(--ink);font-weight:600;border-bottom-color:var(--accent);}
.tabs .cnt{padding:1px 7px;border-radius:999px;background:var(--surface-3);font-size:11px;color:var(--ink-3);}
.derived{display:inline-flex;align-items:center;gap:8px;height:32px;padding:0 10px;border-radius:8px;background:var(--surface-3);font-size:13px;white-space:nowrap;} .derived b{font-weight:600;} .derived i{font-style:normal;font-size:10px;font-weight:600;color:var(--ink-4);text-transform:uppercase;letter-spacing:.06em;}
.riskbar{position:relative;display:flex;height:10px;border-radius:999px;overflow:hidden;} .riskbar span{opacity:.35;} .riskmark{position:relative;height:0;} .riskmark i{position:absolute;top:-16px;width:4px;height:22px;margin-inline-start:-2px;border-radius:2px;background:var(--danger);}
.stepper{display:flex;flex-direction:column;gap:14px;} .step{display:flex;align-items:flex-start;gap:12px;} .step .m{display:flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:999px;flex:none;border:2px solid var(--border-2);} .step.cur .m{background:var(--warn);border-color:var(--warn);} .step.done .m{background:var(--ok);border-color:var(--ok);color:#fff;} .step .m i{width:8px;height:8px;border-radius:999px;background:#fff;} .step .t{font-family:var(--mono);font-size:13px;font-weight:600;} .step.next .t{color:var(--ink-3);}
.timeline{position:relative;} .tl-row{display:flex;gap:16px;padding:14px 20px;border-bottom:1px solid var(--border);} .tl-row:last-child{border-bottom:0;} .tl-dot{position:relative;width:14px;flex:none;padding-top:5px;} .tl-dot span{display:block;width:14px;height:14px;border-radius:999px;border:3px solid var(--surface);box-shadow:0 0 0 1.5px var(--ok);background:var(--ok);} .tl-dot.draft span{background:var(--warn);box-shadow:0 0 0 1.5px var(--warn);} .tl-dot.comp span{background:var(--accent);box-shadow:0 0 0 1.5px var(--accent);}
.empty{padding:32px 20px;text-align:center;color:var(--ink-3);font-size:14px;}

/* ---------- app shell ---------- */
#app{min-height:100%;display:flex;flex-direction:column;} #app.fixed{height:100%;}
.shell{display:flex;flex:1;min-height:0;} .side{display:flex;flex-direction:column;width:248px;flex:none;background:var(--side);color:var(--side-text);}
.side-brand{display:flex;align-items:center;gap:12px;height:72px;padding:0 20px;border-bottom:1px solid var(--side-border);} .side-brand b{display:block;font-size:15px;font-weight:700;color:#fff;letter-spacing:-.01em;} .side-brand small{display:block;font-size:11px;font-weight:500;color:var(--side-muted);text-transform:uppercase;letter-spacing:.1em;}
.side-nav{display:flex;flex-direction:column;gap:2px;padding:16px 12px;flex:1;overflow:auto;} .side-nav a{position:relative;display:flex;align-items:center;gap:12px;height:44px;padding:0 14px;border-radius:8px;color:var(--side-text);font-size:14px;font-weight:500;text-decoration:none;} .side-nav a:hover{background:var(--side-chip);color:#fff;} .side-nav a.on{background:var(--side-active);color:#fff;font-weight:600;}
.side-nav a.on::before{content:"";position:absolute;top:10px;bottom:10px;inset-inline-start:0;width:3px;border-radius:0 3px 3px 0;background:var(--side-mark);} [dir="rtl"] .side-nav a.on::before{border-radius:3px 0 0 3px;}
.side-foot{display:flex;flex-direction:column;gap:12px;padding:16px;border-top:1px solid var(--side-border);} .side-org{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;background:var(--side-chip);} .side-org b{display:block;font-size:13px;font-weight:600;color:#fff;font-family:var(--mono);} .side-org small{display:block;font-size:12px;color:var(--side-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.side-user{display:flex;align-items:center;gap:10px;width:100%;text-align:start;border-radius:8px;padding:4px;} .side-user:hover{background:var(--side-chip);} .side-user b{display:block;font-size:13px;font-weight:600;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;} .side-user small{display:block;font-size:12px;color:var(--side-muted);}
.main{display:flex;flex-direction:column;flex:1;min-width:0;overflow:auto;} .topbar{display:flex;flex:none;align-items:center;justify-content:space-between;gap:16px;min-height:72px;padding:12px 28px;flex-wrap:wrap;} .topbar h1{font-size:18px;font-weight:600;letter-spacing:-.01em;} .topbar .sub{font-size:13px;color:var(--ink-3);}

  });
  // records from the other centers (they enter their own data in their own portals)
  const others = [['org-site-sto', 'RP-e19b52', 'SE', 'MALE', 108, -100, { hba1c: 5.6, fasting_glucose: 97, symptom_count: 0 }], ['org-site-sto', 'RP-e19b52', 'SE', 'MALE', 111, -8, { hba1c: 5.7, fasting_glucose: 99, symptom_count: 1 }],
    ['org-site-bos', 'RP-40ac77', 'US', 'FEMALE', 54, -70, { hba1c: 5.6, fasting_glucose: 98, symptom_count: 1 }], ['org-site-bos', 'RP-b7d3e8', 'US', 'MALE', 146, -35, { hba1c: 5.4, fasting_glucose: 93, symptom_count: 0 }]];
  others.forEach(([org, ps, c, sex, age, days, payload]) => data.researchRecords.push({ id: 'rr-' + (data.nextIds.record++), study: 'st-1', sourceType: 'SITE', sourceOrg: org, pseudonym: ps, eventType: 'VISIT', eventMonth: d(days).slice(0, 7), ageMonths: age, sex, country: c, payload, pseudoVersion: 'v3', createdAt: d(days) + 'T10:00:00' }));
  data.researchRecords.push({ id: 'rr-' + (data.nextIds.record++), study: 'st-1', sourceType: 'SITE', sourceOrg: 'org-site-bos', pseudonym: 'RP-b7d3e8', eventType: 'PREDICTION', eventMonth: d(-35).slice(0, 7), ageMonths: 146, sex: 'MALE', country: 'US', payload: { risk_score: 0.18, category: 'Low', next_visit_weeks: 26 }, pseudoVersion: 'v3', createdAt: d(-35) + 'T10:05:00' });
  // predictions for site subjects with finalized visits
  subjects.filter((s) => s.ownerType === 'RESEARCH_CENTER').forEach((s) => computePrediction(data, s.id, { silent: true }));

}

function kioskCategory(sym, fam) {
  const n = sym.filter((x) => x !== 'none').length;
  let score = n * 0.16 + (fam === 'first_degree' ? 0.18 : fam === 'second_degree' ? 0.08 : 0);
  return score >= 0.45 ? 'High' : score >= 0.2 ? 'Moderate' : 'Low';
}

// --- mock prediction model ("v2.1") — a transparent rule, not a trained model
function riskFromVisit(subject, visit) {
  const dta = visit.data || {};
  const sym = (dta.symptoms || []).filter((x) => x !== 'none').length;
  let s = 0.06 + sym * 0.11;
  if (dta.hba1c_percent >= 5.7) s += 0.14;
  if (dta.hba1c_percent >= 6.0) s += 0.16;
  if (dta.fasting_glucose_mgdl >= 100) s += 0.08;
  if (subject.familyHistory === 'first_degree') s += 0.12; else if (subject.familyHistory === 'second_degree') s += 0.05;
  if (subject.hla && /DR3\/DR4|DR4\/DR4/.test(subject.hla)) s += 0.12;
  if (dta.autoantibody_panel === 'positive') s += 0.22;
  return Math.max(0.02, Math.min(0.98, Math.round(s * 100) / 100));
}

function computePrediction(data, subjectId, opts) {
  const subject = data.subjects.find((s) => s.id === subjectId);
  const fin = data.visits.filter((v) => v.subject === subjectId && v.status === 'FINALIZED' && (v.type === 'SITE_VISIT' || v.type === 'LAB_WALK_IN')).sort((a, b) => a.number - b.number);
  if (!fin.length) return null;
  const last = fin[fin.length - 1];
  const score = riskFromVisit(subject, last);
  const category = score >= 0.6 ? 'High' : score >= 0.3 ? 'Moderate' : 'Low';
  const weeks = category === 'High' ? 4 : category === 'Moderate' ? 12 : 26;
  const computedAt = last.finalizedAt || new Date().toISOString();
  const nextDate = isoDate(addDays(new Date(computedAt), weeks * 7));
  const pred = { id: 'pr-' + subjectId + '-' + last.number, subject: subjectId, score, category, weeks, nextDate, model: 'v2.1', computedAt, fromVisits: fin.map((v) => v.number) };
  data.predictions = data.predictions.filter((p) => p.subject !== subjectId).concat([pred]);
  if (subject.pseudonym && subject.study) {
    data.researchRecords = data.researchRecords.filter((r) => !(r.pseudonym === subject.pseudonym && r.eventType === 'PREDICTION' && r.eventMonth === computedAt.slice(0, 7)));
    data.researchRecords.push({ id: 'rr-' + (data.nextIds.record++), study: subject.study, sourceType: 'SITE', sourceOrg: subject.ownerOrg, pseudonym: subject.pseudonym, eventType: 'PREDICTION', eventMonth: computedAt.slice(0, 7), ageMonths: ageInMonths(subject.dob, computedAt), sex: subject.sex, country: subject.country, payload: { risk_score: score, category, next_visit_weeks: weeks }, pseudoVersion: 'v3', createdAt: computedAt });
  }
  return pred;
}

function projectVisit(data, v) {
  const s = data.subjects.find((x) => x.id === v.subject);
  if (!s || !s.pseudonym || !s.study) return null;
  const consent = data.consents.find((c) => c.subject === s.id && c.type === 'RESEARCH_PARTICIPATION');
  if (!consent || consent.status !== 'GRANTED') return null;
  const dta = v.data || {};
  const rec = { id: 'rr-' + (data.nextIds.record++), study: s.study, sourceType: 'SITE', sourceOrg: s.ownerOrg, pseudonym: s.pseudonym, eventType: 'VISIT', eventMonth: v.date.slice(0, 7), ageMonths: ageInMonths(s.dob, v.date), sex: s.sex, country: s.country,
    payload: { hba1c: dta.hba1c_percent, fasting_glucose: dta.fasting_glucose_mgdl, symptom_count: (dta.symptoms || []).filter((x) => x !== 'none').length, autoantibody: dta.autoantibody_panel || null }, pseudoVersion: 'v3', createdAt: v.finalizedAt || new Date().toISOString(), visit: v.id };
  data.researchRecords = data.researchRecords.filter((r) => r.visit !== v.id);
  data.researchRecords.push(rec);
  return rec;
}

function route() {
  const path = currentPath(); const seg = path.split('/').filter(Boolean);
  state.ui.langOpen = false; state.ui.userOpen = false; state.ui.drawer = false;
  if (!state.session) {
    if (seg[0] === 'mfa' && state.ui.pendingUser) { state.ui.route = ['mfa']; }
    else { state.ui.route = ['login']; if (path !== '/login') { location.hash = '#/login'; return; } }
    render(); return;
  }
  const portal = state.session.portal; const home = portalHome(portal).slice(1);
  if (!seg.length || seg[0] === 'login' || seg[0] === 'mfa' || seg[0] !== home) { location.hash = '#' + portalHome(portal); return; }
  state.ui.route = seg; render();
}
function page() {
  const r = state.ui.route || ['login'];
  if (r[0] === 'login') return loginView();
  if (r[0] === 'mfa') return mfaView();
  if (r[0] === 'lab') {
    if (r[1] === 'subjects' && r[2]) return labSubject(r[2]);
    if (r[1] === 'subjects') return labSubjects();
    if (r[1] === 'visit' && r[2]) return labVisitEditor(r[2]);
    if (r[1] === 'visits') return labVisits();
    if (r[1] === 'followups') return labFollowups();
    if (r[1] === 'settings') return settingsView(labNav(), 'settings');
    return labDashboard();
  }
  if (r[0] === 'research') {
    if (r[1] === 'studies' && r[2]) return resStudy(r[2]);
    if (r[1] === 'records') return resRecords();
    if (r[1] === 'reports') return resReports();
    if (r[1] === 'exports') return resExports();
    if (r[1] === 'settings') return settingsView(resNav(), 'settings');
    return resStudies();
  }
  if (r[0] === 'admin') {
    if (r[1] === 'orgs') return adminOrgs();
    if (r[1] === 'users') return adminUsers();
    if (r[1] === 'studies') return adminStudies();
    if (r[1] === 'fields') return adminFields();
    if (r[1] === 'audit') return adminAudit();
    if (r[1] === 'settings') return settingsView(adminNav(), 'settings');
    return adminHome();
  }
  if (r[0] === 'kiosk') return kioskView();
  if (r[0] === 'me') {
    if (r[1] === 'entry') return meEntry();
    if (r[1] === 'history') return meHistory();
    if (r[1] === 'consent') return meConsent();

    return meHome();
  }
  return loginView();
}

// ---------------------------------------------------------------- events
let autosaveTimer = null;

  if (autosaveTimer) clearTimeout(autosaveTimer);
  autosaveTimer = setTimeout(() => { saveVisitDraft(v, true); const c = document.getElementById('save-chip'); if (c) c.innerHTML = saveChip(v); const rail = document.getElementById('visit-rail'); if (rail) rail.innerHTML = visitRail(v, subject(v.subject), versionByNumber(v.schemaVersion)); }, 1200);
}
const ACTIONS = {

  'nav': (p) => navigate(p.to),
  'toggle-lang': () => { state.ui.langOpen = !state.ui.langOpen; state.ui.userOpen = false; render(); },

  'sign-out': () => signOut(),

  'demo-login': (p) => { const f = document.querySelector('[data-submit="login"]'); if (f) { f.username.value = p.u; f.password.value = 'demo'; } doLogin(p.u, 'demo'); },
  'modal-close': () => closeModal(),

  'copy-csv': () => { const pre = document.getElementById('csv-text'); if (!pre) return; const txt = pre.textContent; if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(() => toast(t('copied'), 'ok'), () => selectText(pre)); else selectText(pre); },
  // lab

};
function selectText(el) { const r = document.createRange(); r.selectNodeContents(el); const s = window.getSelection(); s.removeAllRanges(); s.addRange(r); }

const INPUTS = {
  'subj-search': (el) => { state.ui.subjSearch = el.value; if ((state.ui.route || [])[1] === 'subjects' && !(state.ui.route || [])[2]) { const pos = el.selectionStart; render(); const n = document.getElementById('subj-search'); if (n) { n.focus(); n.setSelectionRange(pos, pos); } } },
  'visit-num': (el) => { const v = currentVisit(); if (!v) return; const val = el.value === '' ? undefined : Number(el.value); v.data[el.dataset.key] = val; const min = el.min !== '' ? Number(el.min) : null, max = el.max !== '' ? Number(el.max) : null; el.classList.toggle('invalid', val != null && ((min != null && val < min) || (max != null && val > max))); touchVisit(v); },
  'visit-text': (el) => { const v = currentVisit(); if (!v) return; v.data[el.dataset.key] = el.value; touchVisit(v); },
  'visit-select': (el) => { const v = currentVisit(); if (!v) return; v.data[el.dataset.key] = el.value || undefined; touchVisit(v); },
  'visit-check': (el) => { const v = currentVisit(); if (!v) return; const key = el.dataset.key; let arr = Array.isArray(v.data[key]) ? v.data[key].slice() : []; if (el.value === 'none' && el.checked) arr = ['none']; else { arr = arr.filter((x) => x !== 'none'); arr = el.checked ? arr.concat([el.value]) : arr.filter((x) => x !== el.value); } v.data[key] = arr; if (el.value === 'none' && el.checked) { document.querySelectorAll('[data-bind="visit-check"][data-key="' + key + '"]').forEach((c) => { if (c.value !== 'none') c.checked = false; }); } else if (el.checked) { const n = document.querySelector('[data-bind="visit-check"][data-key="' + key + '"][value="none"]'); if (n) n.checked = false; } touchVisit(v); },

  'rr-age': (el) => { state.ui.rr.age = el.value; render(); }, 'rr-sex': (el) => { state.ui.rr.sex = el.value; render(); }, 'rr-country': (el) => { state.ui.rr.country = el.value; render(); }, 'rr-source': (el) => { state.ui.rr.source = el.value; render(); },

};

function init() {

    const el = e.target.closest('[data-act]');
